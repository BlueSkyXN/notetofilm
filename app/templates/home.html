<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoteToFilm · 出口成片</title><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/style.css"><script src="/static/common.js" defer></script><script src="/static/home.js" defer></script></head>
<body>
<header class="topbar"><div class="topbar-inner">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">▶</span>NoteToFilm <span class="brand-sub">出口成片</span></a>
  <nav aria-label="站点导航"><button class="ghost theme-toggle" data-action="theme" type="button" aria-label="切换深色模式">◐</button><a href="/api-docs">API 文档</a><a href="/admin">管理员设置</a><button id="logout" class="ghost" type="button" hidden>退出管理员</button></nav>
</div></header>
<main class="main">
  <div class="page-header"><div><div class="eyebrow">YOUR VIDEO WORKSPACE</div><h1>从一份文稿，到一支视频。</h1><p class="muted">先确认内容，再生成画面与旁白。每一步，由你决定。</p></div><a class="text-link" href="#tasks">继续已有任务 ↓</a></div>
  <ol class="steps" aria-label="制作流程"><li aria-current="step"><span>01</span>输入文稿</li><li><span>02</span>确认分镜</li><li><span>03</span>复核图音</li><li><span>04</span>合成下载</li></ol>
  <div class="studio">
    <section class="panel" aria-labelledby="input-title">
      <div class="panel-title"><h2 id="input-title">创建新视频</h2><span id="counter" class="counter">等待输入</span></div>
      <form id="submit-form">
        <label for="script" class="sr-only">输入文稿</label>
        <textarea id="script" rows="11" required aria-describedby="estimate input-limits" placeholder="粘贴你的文稿…&#10;&#10;可以用空行分段。生成分镜后，仍可修改旁白、增加或删除镜头。"></textarea>
        <p id="input-limits" class="fine muted"></p>
        <div class="panel-foot"><p id="estimate" class="fine muted">提交会生成分镜计划，可能调用付费模型；尚不生成图片和配音。</p><button id="submit" type="submit" class="primary">生成分镜计划 →</button></div>
      </form>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
    </section>
    <section class="panel tasks-panel" aria-labelledby="task-heading">
      <div class="panel-title"><h2 id="task-heading">我的任务</h2><button id="refresh-tasks" class="ghost" type="button">刷新</button></div>
      <p class="fine muted">接着上次的进度，或下载已经完成的视频。</p>
      <div id="task-error" class="notice error" role="status" aria-live="polite"></div>
      <div id="tasks" class="task-list" aria-busy="true"><div class="empty">正在读取任务…</div></div>
    </section>
  </div>
  <aside class="storage-note" aria-label="数据保存提示"><strong>无需登录，任务保留在当前浏览器身份下。</strong><p id="visitor-note">清除 Cookie、换设备或访客会话到期后无法找回，请及时下载；不要提交敏感文稿。</p><p id="storage-note" hidden></p></aside>
</main>
</body></html>
