services:
  notetofilm:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./data:/svc/data
    environment:
      - ACCESS_TOKEN=${ACCESS_TOKEN:-}
      - OPENAI_BASE=${OPENAI_BASE:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - IMAGE_MODEL=${IMAGE_MODEL:-}
      - FEISHU_WEBHOOK=${FEISHU_WEBHOOK:-}
      - MAX_ACTIVE_TASKS=${MAX_ACTIVE_TASKS:-3}
    restart: unless-stopped
