services:
  notetofilm:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/svc/data
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-${ACCESS_TOKEN:?Set ADMIN_TOKEN or ACCESS_TOKEN before starting}}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,::1}
      LLM_BASE: ${LLM_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      IMAGE_BASE: ${IMAGE_BASE:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      OPENAI_BASE: ${OPENAI_BASE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-origin-deepseek-v4-1-flash}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2.5-sunburst}
      IMAGE_SIZE: ${IMAGE_SIZE:-1024x768}
      IMAGE_TIMEOUT: ${IMAGE_TIMEOUT:-300}
      STYLE_PRESET: ${STYLE_PRESET:-扁平插画风格，蓝白主色调，简洁构图，画面中不出现文字}
      TTS_VOICE: ${TTS_VOICE:-zh-CN-YunxiNeural}
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK:-}
      MAX_ACTIVE_TASKS: ${MAX_ACTIVE_TASKS:-3}
      MAX_RENDER_TASKS: ${MAX_RENDER_TASKS:-1}
      MAX_SCRIPT_CHARS: ${MAX_SCRIPT_CHARS:-20000}
      MAX_SCENES: ${MAX_SCENES:-30}
      MAX_NARRATION_CHARS: ${MAX_NARRATION_CHARS:-2000}
      RENDER_TIMEOUT: ${RENDER_TIMEOUT:-1800}
      MAX_IMAGE_REQUESTS_PER_TASK: ${MAX_IMAGE_REQUESTS_PER_TASK:-60}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-256}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-180}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-900}
      MAX_DAILY_TASKS: ${MAX_DAILY_TASKS:-20}
      MAX_VISITOR_DAILY_TASKS: ${MAX_VISITOR_DAILY_TASKS:-5}
      MAX_DAILY_LLM_REQUESTS: ${MAX_DAILY_LLM_REQUESTS:-40}
      MAX_DAILY_IMAGE_REQUESTS: ${MAX_DAILY_IMAGE_REQUESTS:-60}
      MAX_DAILY_AUDIO_REQUESTS: ${MAX_DAILY_AUDIO_REQUESTS:-120}
      MAX_DAILY_RENDER_REQUESTS: ${MAX_DAILY_RENDER_REQUESTS:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 45s
    restart: unless-stopped
