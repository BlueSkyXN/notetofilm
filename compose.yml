services:
  notetofilm:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./config:/svc/config
      - ./data:/svc/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 45s
    restart: unless-stopped
